    <path d="M24 11 38 17.5v13L24 37 10 30.5v-13L24 11Z"/>
    <path d="M10 17.5 24 24l14-6.5M24 24v13"/>
    <path d="M17 14.2 31 20.7"/>
  </g>
</svg>
